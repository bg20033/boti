[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boti-studio"
version = "0.16.2"
description = "Local campaign clipping coordinator and Windows workers for Kick, Twitch, YouTube and local files"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "cryptography>=44", "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20", "yt-dlp>=2025.1", "psutil>=6,<8",
  "Pillow>=11,<13", "google-auth-oauthlib>=1.2,<2", "tzdata>=2025.1",
]

[project.optional-dependencies]
worker = ["faster-whisper>=1.1,<2", "av>=11,<19", "opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
boti = "boti.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["boti"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
